# อัปเดตรายการชีตและเผยแพร่เว็บขึ้น GitHub Pages อัตโนมัติ
# ทำงานทุกครั้งที่มีการอัปโหลด/แก้ไข/ลบไฟล์บน branch main
name: อัปเดตเว็บคลังชีต

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ต้องใช้ประวัติทั้งหมดเพื่อหาวันที่อัปโหลดของแต่ละชีต

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: สร้างรายการชีต (sheets.json)
        run: node scripts/build-index.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
